<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Pastel Pony Calculator</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<header>
  <h1>Pastel Pony Calculator</h1>
</header>
    <div class="rainbow">
      <div class="red"></div>
      <div class="orange"></div>
      <div class="yellow"></div>
      <div class="green"></div>
      <div class="blue"></div>
      <div class="indigo"></div>
      <div class="violet"></div>
    </div>
  <div class="calculator-wrap">
    <div class="carousel-horse" aria-hidden="true" title="Carousel Horse">🎠</div>
    <div class="calculator">
      <div id="display">1234</div>
      <div class="buttons">
      <button class="btn" data-action="clear">C</button>
      <button class="btn" data-action="backspace">⌫</button>
      <button class="btn operator" data-operator="/">÷</button>
      <button class="btn operator" data-operator="*">×</button>

      <button class="btn digit">7</button>
      <button class="btn digit">8</button>
      <button class="btn digit">9</button>
      <button class="btn operator" data-operator="-">−</button>

      <button class="btn digit">4</button>
      <button class="btn digit">5</button>
      <button class="btn digit">6</button>
      <button class="btn operator" data-operator="+">+</button>

      <button class="btn digit">1</button>
      <button class="btn digit">2</button>
      <button class="btn digit">3</button>
      <button class="btn equals">=</button>

      <button class="btn digit zero">0</button>
      <button class="btn decimal">.</button>
      </div>
    </div>
  </div>
  <footer class="site-footer">
    <p>Click <a href="../index.html">here</a> for the original assignment</p>
    <p>
      &copy; 2025 - a project from
      <a href="https://www.theodinproject.com">The Odin Project</a> - made by
      <a href="https://www.github.com/PastelPrism">Amy</a>
    </p>
  </footer>
  <script src="script.js"></script>
</body>
</html>
